name: Compile Server

on:
  push:
    branches: [ "stable", "dev" ]
  pull_request:
    branches: [ "stable", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libssl-dev zlib1g-dev

    - name: Static build
      run: |
        # Для полной статической сборки
        cmake -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_FLAGS="-static -static-libgcc -static-libstdc++" \
              -DCMAKE_EXE_LINKER_FLAGS="-static" \
              .
        make
        
        # Проверяем зависимости
        echo "=== Проверка зависимостей ==="
        ldd advancedserver/AdvancedServer 2>/dev/null || echo "Бинарник статический (ldd не работает)"

    - name: Upload server binary
      uses: actions/upload-artifact@v4
      with:
        name: Linux-Static
        path: advancedserver/AdvancedServer
