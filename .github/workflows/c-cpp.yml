name: Compile Server

on:
  push:
    branches: [ "stable", "dev" ]
  pull_request:
    branches: [ "stable", "dev" ]

jobs:
  build:
    runs-on: ubuntu-20.04  # <-- Изменено здесь (было ubuntu-latest)
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
      
      - name: cmake
        run: cmake .
      
      - name: make
        run: make
      
      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: Linux
          path: advancedserver/AdvancedServer
