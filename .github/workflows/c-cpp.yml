name: Compile Server

on:
  push:
    branches: [ "stable", "dev" ]
  pull_request:
    branches: [ "stable", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:11  # или debian:12 для современных систем
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y build-essential cmake git
          
      - name: Build
        run: |
          cmake .
          make
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Linux
          path: advancedserver/AdvancedServer
